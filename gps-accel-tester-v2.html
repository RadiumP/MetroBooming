<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>地铁环境传感器测试 v2</title>
<style>:root{--bg:#0a0e14;--p:#111820;--tx:#eef2f5;--sub:#81909d;--gps:#ff9f45;--acc:#5bc9e8;--mic:#a8d66c;--bad:#e8615a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:12px ui-monospace,Consolas,monospace;padding:14px}.app{max-width:620px;margin:auto;display:grid;gap:10px}.box{background:var(--p);border-radius:12px;padding:12px}.status,.buttons,.metrics{display:flex;gap:8px;flex-wrap:wrap}.status span{flex:1;min-width:120px;color:var(--sub)}b{color:var(--tx)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:5px}.ok{background:#5bc98d}.warn{background:#ffb454}.metrics{display:grid;grid-template-columns:repeat(3,1fr)}.card{text-align:center;border:1px solid #27333e}.name,.unit,.detail{color:var(--sub);font-size:10px}.value{font-size:30px;font-weight:bold;margin:7px 0}.gps .value{color:var(--gps)}.acc .value{color:var(--acc)}.mic .value{color:var(--mic)}.detail{line-height:1.5;min-height:30px}canvas{width:100%;height:150px;display:block}.state{display:grid;grid-template-columns:1fr 1fr;gap:8px}.state strong{font-size:18px}.confidence{height:7px;background:#27333e;margin-top:7px}.confidence i{display:block;height:100%;background:#a8d66c;width:0}.buttons button{flex:1;border:0;border-radius:10px;padding:14px;font-weight:bold;background:var(--gps)}button.secondary{background:#33465a;color:white}button:disabled{opacity:.4}.hint{color:var(--sub);text-align:center;line-height:1.6}@media(max-width:500px){.metrics{grid-template-columns:1fr}.state{grid-template-columns:1fr}}</style></head>
<body><main class="app"><section class="box status"><span><i id="gd" class="dot"></i>GPS <b id="gs">未启动</b></span><span><i id="ad" class="dot"></i>加速度 <b id="as">未启动</b></span><span><i id="md" class="dot"></i>麦克风 <b id="ms">未启动</b></span></section>
<section class="metrics"><div class="box card gps"><div class="name">GPS 速度</div><div id="gv" class="value">--</div><div class="unit">km/h</div><div id="gsub" class="detail">精度 --</div></div><div class="box card acc"><div class="name">振动强度</div><div id="av" class="value">--</div><div class="unit">linear RMS m/s²</div><div id="asub" class="detail">峰值 -- · jerk --</div></div><div class="box card mic"><div class="name">声音特征</div><div id="mv" class="value">--</div><div class="unit">spectral centroid Hz</div><div id="msub" class="detail">RMS -- · 高频比 --</div></div></section>
<section class="box state"><div><div class="name">推测列车状态</div><strong id="trainState">等待数据</strong><div class="confidence"><i id="conf"></i></div></div><div><div class="name">冲击事件</div><strong id="shock">无</strong><div id="shockSub" class="detail">动态阈值校准中</div></div></section>
<section class="box"><canvas id="chart" width="1200" height="300"></canvas><div class="hint">橙：可靠 GPS　蓝：振动 RMS　绿：频谱质心（固定量程）</div></section>
<section class="box status"><span>样本 <b id="count">0</b></span><span>时长 <b id="elapsed">00:00</b></span><span>冲击 <b id="shocks">0</b></span></section><section class="buttons"><button id="toggle">开始测试</button><button id="mark" class="secondary" disabled>手动标记状态</button><button id="export" class="secondary" disabled>导出 CSV</button></section><div id="hint" class="hint">只保存传感器特征数值，不录音。请用 HTTPS 打开，并将手机放在实际游戏时的位置。</div></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),TICK=250,WIN=120;let active=false,start=0,timer=null,watch=null,wake=null,samples=[],marks=[],shockCount=0,lastShock=0;
const gps={speed:null,accuracy:null,lat:null,lon:null,time:0},acc={gravity:{x:0,y:0,z:0},linear:[],jerk:[],last:null,baseline:0.08},mic={ctx:null,an:null,stream:null,time:null,freq:null,prev:null,sampleRate:44100};const chart={gps:[],acc:[],mic:[]};
function status(prefix,state,text){$(prefix+'d').className='dot '+state;$(prefix+'s').textContent=text}function mean(a){return a.length?a.reduce((s,v)=>s+v,0)/a.length:0}function rms(a){return Math.sqrt(mean(a.map(v=>v*v)))}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function fmt(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function hav(a,b,c,d){const R=6371000,r=x=>x*Math.PI/180,dl=r(c-a),dn=r(d-b),q=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
let lastFix=null;function startGps(){if(!navigator.geolocation){status('g','','不支持');return}status('g','warn','定位中');watch=navigator.geolocation.watchPosition(p=>{const c=p.coords,now=Date.now();let speed=typeof c.speed==='number'?c.speed*3.6:null;if(speed===null&&lastFix){const dt=(now-lastFix.t)/1000;if(dt>0)speed=hav(lastFix.lat,lastFix.lon,c.latitude,c.longitude)/dt*3.6}lastFix={lat:c.latitude,lon:c.longitude,t:now};gps.speed=speed===null?null:clamp(speed,0,180);gps.accuracy=c.accuracy;gps.lat=c.latitude;gps.lon=c.longitude;gps.time=now;status('g',c.accuracy<=50?'ok':'warn',c.accuracy<=50?'可靠':'精度较低')},e=>status('g','',e.code===1?'权限拒绝':'暂无信号'),{enableHighAccuracy:true,maximumAge:2000,timeout:10000})}
function onMotion(e){let a=e.acceleration;if(a&&a.x!=null){const m=Math.hypot(a.x,a.y,a.z);acc.linear.push(m);if(acc.last!=null)acc.jerk.push(Math.abs(m-acc.last)/(Math.max(e.interval||16,1)/1000));acc.last=m}else{a=e.accelerationIncludingGravity;if(!a||a.x==null)return;const k=.92;acc.gravity.x=k*acc.gravity.x+(1-k)*a.x;acc.gravity.y=k*acc.gravity.y+(1-k)*a.y;acc.gravity.z=k*acc.gravity.z+(1-k)*a.z;const m=Math.hypot(a.x-acc.gravity.x,a.y-acc.gravity.y,a.z-acc.gravity.z);acc.linear.push(m);if(acc.last!=null)acc.jerk.push(Math.abs(m-acc.last)/(Math.max(e.interval||16,1)/1000));acc.last=m}status('a','ok','采集中')}
async function startAccel(){try{if(typeof DeviceMotionEvent==='undefined'){status('a','','不支持');return}if(typeof DeviceMotionEvent.requestPermission==='function'&&await DeviceMotionEvent.requestPermission()!=='granted'){status('a','','权限拒绝');return}addEventListener('devicemotion',onMotion);status('a','warn','等待数据')}catch{status('a','','启动失败')}}
async function startMic(){try{mic.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});mic.ctx=new(window.AudioContext||window.webkitAudioContext)();await mic.ctx.resume();mic.sampleRate=mic.ctx.sampleRate;mic.an=mic.ctx.createAnalyser();mic.an.fftSize=2048;mic.an.smoothingTimeConstant=.25;mic.time=new Uint8Array(mic.an.fftSize);mic.freq=new Uint8Array(mic.an.frequencyBinCount);mic.ctx.createMediaStreamSource(mic.stream).connect(mic.an);status('m','ok','采集中')}catch{status('m','','权限或设备失败')}}
function audioFeatures(){if(!mic.an)return{rms:0,centroid:0,low:0,mid:0,high:0,ratio:0,flux:0};mic.an.getByteTimeDomainData(mic.time);mic.an.getByteFrequencyData(mic.freq);let ss=0;for(const v of mic.time)ss+=((v-128)/128)**2;const out={rms:Math.sqrt(ss/mic.time.length),centroid:0,low:0,mid:0,high:0,ratio:0,flux:0},bin=mic.sampleRate/mic.an.fftSize;let ew=0,es=0,lc=0,mc=0,hc=0,flux=0;for(let i=1;i<mic.freq.length;i++){const hz=i*bin,e=mic.freq[i]**2;es+=e;ew+=hz*e;if(hz<250){out.low+=e;lc++}else if(hz<2000){out.mid+=e;mc++}else if(hz<8000){out.high+=e;hc++}if(mic.prev)flux+=Math.max(0,mic.freq[i]-mic.prev[i])}out.centroid=es?ew/es:0;out.low=Math.sqrt(out.low/Math.max(lc,1));out.mid=Math.sqrt(out.mid/Math.max(mc,1));out.high=Math.sqrt(out.high/Math.max(hc,1));out.ratio=out.high/(out.low+1);out.flux=flux/mic.freq.length;mic.prev=new Uint8Array(mic.freq);return out}
function infer(m,a,gReliable){let score=0,confidence=.35;if(m.rms>.015){score+=clamp(m.centroid/3500,0,1)*.45+clamp(m.ratio/1.3,0,1)*.25+clamp(a.rms/.5,0,1)*.3;confidence+=.35}if(gReliable){score=.55*score+.45*clamp(gps.speed/80,0,1);confidence+=.3}let state=score<.16?'停站/安静':score<.35?'起步或低速':score<.62?'巡航':'高速';return{state,score,confidence:clamp(confidence,0,1)}}
function tick(){const now=Date.now(),lin=acc.linear.splice(0),jerk=acc.jerk.splice(0),af={rms:rms(lin),peak:lin.length?Math.max(...lin):0,jerkRms:rms(jerk),jerkPeak:jerk.length?Math.max(...jerk):0};acc.baseline=.995*acc.baseline+.005*Math.min(af.rms,.8);const threshold=Math.max(.75,acc.baseline*4),shock=af.peak>threshold&&now-lastShock>3500;if(shock){lastShock=now;shockCount++;$('shock').textContent='检测到冲击';$('shockSub').textContent=`峰值 ${af.peak.toFixed(2)} m/s²` }else if(now-lastShock>1200){$('shock').textContent='无';$('shockSub').textContent=`阈值 ${threshold.toFixed(2)} m/s²`}const mf=audioFeatures(),fresh=now-gps.time<5000,reliable=fresh&&gps.accuracy<=50&&gps.speed!=null,inf=infer(mf,af,reliable);let row={elapsed_ms:now-start,gps_speed_kmh:gps.speed,gps_accuracy_m:gps.accuracy,gps_fresh: fresh?1:0,gps_reliable:reliable?1:0,gps_lat:gps.lat,gps_lon:gps.lon,accel_rms:af.rms,accel_peak:af.peak,jerk_rms:af.jerkRms,jerk_peak:af.jerkPeak,shock:shock?1:0,shock_threshold:threshold,mic_rms:mf.rms,mic_centroid_hz:mf.centroid,mic_low:mf.low,mic_mid:mf.mid,mic_high:mf.high,mic_high_low_ratio:mf.ratio,mic_flux:mf.flux,train_state:inf.state,state_score:inf.score,state_confidence:inf.confidence,mark:''};samples.push(row);$('gv').textContent=gps.speed==null?'--':gps.speed.toFixed(1);$('gsub').textContent=gps.accuracy==null?'精度 --':`精度 ±${Math.round(gps.accuracy)}m · ${reliable?'采用':'降权'}`;$('av').textContent=af.rms.toFixed(3);$('asub').textContent=`峰 ${af.peak.toFixed(2)} · jerk ${af.jerkRms.toFixed(1)}`;$('mv').textContent=Math.round(mf.centroid)||'--';$('msub').textContent=`RMS ${mf.rms.toFixed(3)} · 高频比 ${mf.ratio.toFixed(2)} · flux ${mf.flux.toFixed(1)}`;$('trainState').textContent=inf.state;$('conf').style.width=(inf.confidence*100)+'%';$('count').textContent=samples.length;$('elapsed').textContent=fmt(now-start);$('shocks').textContent=shockCount;chart.gps.push(reliable?gps.speed/120:null);chart.acc.push(clamp(af.rms/1.5,0,1));chart.mic.push(clamp(mf.centroid/5000,0,1));for(const k in chart)if(chart[k].length>WIN)chart[k].shift();draw()}
function draw(){const c=$('chart'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle='#26313a';x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}[['gps','#ff9f45'],['acc','#5bc9e8'],['mic','#a8d66c']].forEach(([k,col])=>{x.beginPath();x.strokeStyle=col;x.lineWidth=3;chart[k].forEach((v,i)=>{if(v==null)return;const px=i*w/(WIN-1),py=h-clamp(v,0,1)*(h-10)-5;if(i===0||chart[k][i-1]==null)x.moveTo(px,py);else x.lineTo(px,py)});x.stroke()})}
function csv(){const cols=Object.keys(samples[0]||{}),esc=v=>'"'+String(v??'').replaceAll('"','""')+'"',lines=[cols.join(','),...samples.map(r=>cols.map(k=>esc(r[k])).join(','))],blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='metro-sensors-'+new Date().toISOString().replace(/[:.]/g,'-')+'.csv';a.click();URL.revokeObjectURL(u)}
async function begin(){active=true;start=Date.now();samples=[];shockCount=0;Object.values(chart).forEach(a=>a.length=0);$('toggle').textContent='停止测试';$('export').disabled=true;$('mark').disabled=false;$('hint').textContent='采集中。请尽量保持与实际游戏相同的持机方式；到站、起步、巡航、高速、制动时可手动标记。';try{wake=await navigator.wakeLock?.request('screen')}catch{}startGps();await startAccel();await startMic();timer=setInterval(tick,TICK)}function stop(){active=false;clearInterval(timer);timer=null;if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;removeEventListener('devicemotion',onMotion);mic.stream?.getTracks().forEach(t=>t.stop());mic.ctx?.close();mic.an=null;wake?.release();$('toggle').textContent='开始测试';$('export').disabled=!samples.length;$('mark').disabled=true;$('hint').textContent=`本次记录 ${samples.length} 条；导出 CSV 后可比较手动标记与自动推测。`}
$('toggle').onclick=()=>active?stop():begin();$('export').onclick=csv;$('mark').onclick=()=>{const label=prompt('输入真实状态：停站 / 起步 / 巡航 / 高速 / 制动');if(label&&samples.length){samples[samples.length-1].mark=label;marks.push({t:Date.now()-start,label});$('hint').textContent='已标记：'+label}};document.addEventListener('visibilitychange',()=>{if(!document.hidden&&active)navigator.wakeLock?.request('screen').then(w=>wake=w).catch(()=>{})});})();</script></body></html>
